<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Najwa ❤️</title>

<style>

/* ==============================
   BASIC
================================ */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#12030b;
    color:white;
    font-family:Georgia,serif;
    overflow-x:hidden;
}


/* ==============================
   DREAM BACKGROUND
================================ */

.bg{
    position:fixed;
    inset:0;
    z-index:-10;

    background:
        radial-gradient(
            circle at 50% 30%,
            rgba(255,120,175,.5),
            transparent 30%
        ),
        radial-gradient(
            circle at 10% 80%,
            rgba(180,40,110,.4),
            transparent 35%
        ),
        radial-gradient(
            circle at 90% 10%,
            rgba(255,80,150,.35),
            transparent 35%
        ),
        linear-gradient(
            145deg,
            #12030b,
            #3b0b26,
            #791d4b,
            #2b071b,
            #090107
        );
}

.bg::before{
    content:"";
    position:absolute;
    inset:-30%;

    background:
        radial-gradient(
            circle,
            rgba(255,190,220,.12),
            transparent 30%
        );

    animation:
        atmosphere 15s ease-in-out infinite alternate;
}

@keyframes atmosphere{

    from{
        transform:
            translate(-5%,-3%)
            scale(1);
    }

    to{
        transform:
            translate(5%,4%)
            scale(1.2);
    }
}


/* ==============================
   STARS
================================ */

.stars{
    position:fixed;
    inset:0;
    z-index:-8;

    background-image:
        radial-gradient(
            white 1px,
            transparent 1px
        ),
        radial-gradient(
            rgba(255,180,215,.8) 1px,
            transparent 1px
        );

    background-size:
        90px 90px,
        160px 160px;

    opacity:.3;

    animation:
        starMove 35s linear infinite;
}

@keyframes starMove{

    from{
        transform:translateY(0);
    }

    to{
        transform:translateY(-120px);
    }
}


/* ==============================
   ENTER
================================ */

#enter{
    position:fixed;
    inset:0;

    z-index:999;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;

    background:
        radial-gradient(
            circle at center,
            #f77da9,
            #74183f 50%,
            #16030d
        );

    transition:
        opacity 1.2s ease;
}

.enter-content{
    animation:
        entrance 2s ease;
}

@keyframes entrance{

    from{
        opacity:0;
        transform:translateY(25px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

.enter-heart{
    font-size:75px;

    filter:
        drop-shadow(
            0 0 35px
            rgba(255,120,180,.9)
        );

    animation:
        beat 1.6s infinite;
}

@keyframes beat{

    50%{
        transform:scale(1.15);
    }
}

.enter-text{
    margin-top:22px;

    font-size:34px;

    font-weight:normal;
}

.enter-date{
    margin-top:12px;

    font-family:Arial,sans-serif;

    font-size:10px;

    letter-spacing:7px;

    opacity:.55;
}

.enter-button{

    margin-top:35px;

    padding:14px 27px;

    border-radius:40px;

    border:
        1px solid
        rgba(255,255,255,.35);

    background:
        rgba(255,255,255,.1);

    color:white;

    font-family:Arial,sans-serif;

    font-size:12px;

    cursor:pointer;

    backdrop-filter:blur(10px);

    transition:.4s;
}

.enter-button:hover{
    transform:scale(1.06);
}


/* ==============================
   HERO
================================ */

.hero{

    min-height:100vh;

    display:flex;

    align-items:center;

    justify-content:center;

    text-align:center;

    padding:30px;
}

.hero-content{
    animation:
        heroAppear 2s ease;
}

@keyframes heroAppear{

    from{
        opacity:0;
        transform:scale(.95);
    }

    to{
        opacity:1;
        transform:scale(1);
    }
}

.date{

    font-family:Arial,sans-serif;

    font-size:11px;

    letter-spacing:8px;

    opacity:.5;

    margin-bottom:25px;
}

.heart{

    font-size:70px;

    filter:
        drop-shadow(
            0 0 30px
            #ff3f91
        );

    animation:
        beat 1.6s infinite;
}

h1{

    margin-top:15px;

    font-size:
        clamp(
            65px,
            18vw,
            105px
        );

    font-weight:normal;

    background:
        linear-gradient(
            90deg,
            #fff,
            #ffc7dc,
            #fff
        );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.be-mine{

    margin-top:4px;

    font-size:28px;

    font-style:italic;

    text-shadow:
        0 0 20px
        rgba(255,160,200,.7);
}

.hint{

    margin-top:60px;

    font-family:Arial,sans-serif;

    font-size:9px;

    letter-spacing:4px;

    opacity:.35;
}


/* ==============================
   MEMORY SECTION
================================ */

.memory{

    min-height:100vh;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:70px 20px;

    text-align:center;
}

.memory-box{

    width:100%;

    max-width:480px;
}

.memory-title{

    font-size:31px;

    font-weight:normal;

    margin-bottom:35px;
}

.memory-title span{
    color:#ffc2da;
}


/* ==============================
   PHOTO
================================ */

.photo-wrap{

    position:relative;

    width:100%;

    height:430px;

    display:flex;

    justify-content:center;

    align-items:center;
}

.photo{

    position:absolute;

    width:82%;

    height:390px;

    padding:7px;

    background:
        rgba(255,255,255,.95);

    border-radius:20px;

    box-shadow:
        0 30px 80px
        rgba(0,0,0,.55);

    opacity:0;

    transform:
        scale(.92)
        rotate(-3deg);

    transition:
        opacity 1.2s ease,
        transform 1.2s ease;
}

.photo.active{

    opacity:1;

    transform:
        scale(1)
        rotate(-2deg);
}

.photo:nth-child(even).active{
    transform:
        scale(1)
        rotate(2deg);
}

.photo img{

    width:100%;
    height:100%;

    object-fit:cover;

    border-radius:14px;
}

.photo-number{

    margin-top:25px;

    font-family:Arial,sans-serif;

    font-size:9px;

    letter-spacing:4px;

    opacity:.35;
}


/* ==============================
   LITTLE LINE
================================ */

.little{

    min-height:55vh;

    display:flex;

    justify-content:center;

    align-items:center;

    text-align:center;

    padding:30px;
}

.little p{

    max-width:400px;

    font-size:25px;

    line-height:1.7;

    font-weight:normal;
}

.little span{
    color:#ffc3da;
}


/* ==============================
   GIFT
================================ */

.surprise{

    min-height:80vh;

    display:flex;

    align-items:center;

    justify-content:center;

    text-align:center;
}

.gift{

    cursor:pointer;

    font-size:70px;

    filter:
        drop-shadow(
            0 0 30px
            rgba(255,120,180,.8)
        );

    animation:
        gift 2s ease-in-out infinite;

    transition:.4s;
}

.gift:hover{
    transform:scale(1.1);
}

@keyframes gift{

    50%{
        transform:translateY(-8px);
    }
}

.gift-text{

    margin-top:12px;

    font-family:Arial,sans-serif;

    font-size:9px;

    letter-spacing:4px;

    opacity:.4;
}


/* ==============================
   SECRET
================================ */

#secret{

    display:none;

    position:fixed;

    inset:0;

    z-index:500;

    background:
        rgba(25,2,14,.82);

    backdrop-filter:blur(18px);

    align-items:center;

    justify-content:center;

    text-align:center;

    padding:25px;
}

.secret-box{

    padding:45px 30px;

    max-width:420px;

    border-radius:30px;

    border:
        1px solid
        rgba(255,255,255,.18);

    background:
        rgba(255,130,180,.1);

    box-shadow:
        0 30px 100px
        rgba(0,0,0,.5);

    animation:
        reveal 1s ease;
}

@keyframes reveal{

    from{
        opacity:0;
        transform:scale(.8);
    }

    to{
        opacity:1;
        transform:scale(1);
    }
}

.secret-heart{
    font-size:55px;
}

.secret-title{

    margin-top:20px;

    font-size:36px;

    font-weight:normal;
}

.secret-name{

    margin-top:18px;

    font-size:22px;

    color:#ffd2e2;
}

.close{

    margin-top:30px;

    font-family:Arial,sans-serif;

    font-size:9px;

    letter-spacing:3px;

    opacity:.35;

    cursor:pointer;
}


/* ==============================
   FLOATING HEARTS
================================ */

.float{

    position:fixed;

    bottom:-50px;

    z-index:20;

    pointer-events:none;

    animation:
        floatUp
        linear
        forwards;

    text-shadow:
        0 0 15px
        rgba(255,120,180,.9);
}

@keyframes floatUp{

    0%{
        opacity:0;

        transform:
            translateY(0)
            translateX(0)
            rotate(0);
    }

    15%{
        opacity:.8;
    }

    100%{
        opacity:0;

        transform:
            translateY(-110vh)
            translateX(var(--move))
            rotate(var(--rotate));
    }
}


/* ==============================
   FLOATING LOVE WORDS
================================ */

.love-float{

    position:fixed;

    bottom:-40px;

    z-index:19;

    pointer-events:none;

    color:#ffd9e7;

    font-size:15px;

    font-style:italic;

    text-shadow:
        0 0 15px
        rgba(255,130,190,.8);

    animation:
        wordsUp
        9s
        linear
        forwards;
}

@keyframes wordsUp{

    0%{
        opacity:0;

        transform:
            translateY(0)
            translateX(0);
    }

    15%{
        opacity:.7;
    }

    100%{
        opacity:0;

        transform:
            translateY(-110vh)
            translateX(var(--move));
    }
}


/* ==============================
   END
================================ */

.end{

    min-height:70vh;

    display:flex;

    justify-content:center;

    align-items:center;

    text-align:center;

    padding:30px;
}

.end-heart{
    font-size:60px;
}

.end h2{

    margin-top:15px;

    font-size:35px;

    font-weight:normal;
}

.end-date{

    margin-top:25px;

    font-family:Arial,sans-serif;

    letter-spacing:7px;

    font-size:11px;

    color:#ffb3d0;
}


/* ==============================
   MOBILE
================================ */

@media(max-width:600px){

    .photo{

        width:90%;

        height:380px;
    }

    .memory{

        padding-top:50px;
    }

}

</style>
</head>


<body>


<!-- BACKGROUND -->

<div class="bg"></div>

<div class="stars"></div>


<!-- ENTER -->

<div id="enter">

    <div class="enter-content">

        <div class="enter-heart">
            ❤️
        </div>

        <div class="enter-text">
            Najwa
        </div>

        <div class="enter-date">
            8 • 8
        </div>

        <button
            class="enter-button"
            onclick="enterLove()"
        >
            Tap to enter ❤️
        </button>

    </div>

</div>


<!-- MUSIC -->

<audio
    id="music"
    loop
>

    <source
        src="music.mp3"
        type="audio/mpeg"
    >

</audio>


<!-- HERO -->

<section class="hero">

    <div class="hero-content">

        <div class="date">
            8 • 8
        </div>

        <div class="heart">
            ❤️
        </div>

        <h1>
            Najwa
        </h1>

        <div class="be-mine">
            Be Mine.
        </div>

        <div class="hint">
            KEEP GOING ↓
        </div>

    </div>

</section>


<!-- MEMORY -->

<section class="memory">

    <div class="memory-box">

        <div class="memory-title">
            A few little things
            <span>❤️</span>
        </div>


        <div class="photo-wrap">

            <div class="photo active">
                <img
                    src="love1.jpg"
                    alt="Love"
                >
            </div>

            <div class="photo">
                <img
                    src="love2.jpg"
                    alt="Love"
                >
            </div>

            <div class="photo">
                <img
                    src="love3.jpg"
                    alt="Love"
                >
            </div>

            <div class="photo">
                <img
                    src="love4.jpg"
                    alt="Love"
                >
            </div>

        </div>


        <div class="photo-number">
            01
        </div>

    </div>

</section>


<!-- LITTLE MESSAGE -->

<section class="little">

    <p>
        Sometimes one person
        becomes
        <span>your favorite thought.</span>
    </p>

</section>


<!-- SURPRISE -->

<section class="surprise">

    <div>

        <div
            class="gift"
            onclick="openGift()"
        >
            🎁
        </div>

        <div class="gift-text">
            FOR YOU
        </div>

    </div>

</section>


<!-- END -->

<section class="end">

    <div>

        <div class="end-heart">
            ❤️
        </div>

        <h2>
            Najwa
        </h2>

        <div class="end-date">
            8 • 8
        </div>

    </div>

</section>


<!-- SECRET -->

<div id="secret">

    <div class="secret-box">

        <div class="secret-heart">
            ❤️
        </div>

        <div class="secret-title">
            Be Mine.
        </div>

        <div class="secret-name">
            Naj ❤️
        </div>

        <div
            class="close"
            onclick="closeGift()"
        >
            TAP TO CLOSE
        </div>

    </div>

</div>


<script>

/* ==============================
   ENTER + MUSIC
================================ */

function enterLove(){

    const enter =
        document.getElementById("enter");

    const music =
        document.getElementById("music");

    music.volume=.65;

    music.play()
    .catch(function(){});

    enter.style.opacity="0";

    setTimeout(function(){

        enter.style.display="none";

    },1200);

}


/* ==============================
   PHOTO CHANGE
================================ */

const photos =
    document.querySelectorAll(".photo");

let current=0;

setInterval(function(){

    photos[current]
        .classList
        .remove("active");

    current++;

    if(current>=photos.length){
        current=0;
    }

    photos[current]
        .classList
        .add("active");

    document.querySelector(
        ".photo-number"
    ).innerText=
        "0"+(current+1);

},3500);


/* ==============================
   GIFT
================================ */

function openGift(){

    const secret =
        document.getElementById("secret");

    secret.style.display="flex";


    for(
        let i=0;
        i<35;
        i++
    ){

        setTimeout(
            createFloat,
            i*60
        );

    }

}


function closeGift(){

    document
        .getElementById("secret")
        .style.display="none";

}


/* ==============================
   FLOATING HEARTS
================================ */

function createFloat(){

    const item =
        document.createElement("div");

    item.className="float";


    const symbols=[

        "❤️",
        "💗",
        "💕",
        "💖",
        "💘",
        "💞",
        "💓",
        "💝",
        "🌸"

    ];


    item.innerHTML=
        symbols[
            Math.floor(
                Math.random()
                *symbols.length
            )
        ];


    item.style.left=
        Math.random()*100+"vw";


    item.style.fontSize=
        (
            13+
            Math.random()*24
        )+"px";


    item.style.setProperty(
        "--move",
        (
            Math.random()*180-90
        )+"px"
    );


    item.style.setProperty(
        "--rotate",
        (
            Math.random()*360
        )+"deg"
    );


    item.style.animationDuration=
        (
            6+
            Math.random()*7
        )+"s";


    document.body.appendChild(item);


    setTimeout(function(){

        item.remove();

    },15000);

}


/* ==============================
   FLOATING WORDS
================================ */

function createLoveText(){

    const text =
        document.createElement("div");

    text.className="love-float";

    text.innerHTML=
        "I love you ❤️";

    text.style.left=
        Math.random()*85+"vw";

    text.style.setProperty(
        "--move",
        (
            Math.random()*160-80
        )+"px"
    );

    document.body.appendChild(text);


    setTimeout(function(){

        text.remove();

    },10000);

}


/* ==============================
   AMBIENT EFFECT
================================ */

setInterval(
    createFloat,
    1100
);

setInterval(function(){

    if(Math.random()<.45){

        createLoveText();

    }

},3500);

</script>

</body>
</html>

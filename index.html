<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Najwa ❤️</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
}

body{
    overflow:hidden;
    font-family:Georgia,serif;
    color:white;
    background:#02050b;
}


/* =========================
   NIGHT BACKGROUND
========================= */

.night{
    position:fixed;
    inset:0;
    overflow:hidden;

    background:
        radial-gradient(circle at 50% 24%,#172b4b 0%,#0b1729 30%,#030812 70%,#010207 100%);

    transition:opacity 1.8s ease;
}

.moon{
    position:absolute;
    width:220px;
    height:220px;
    top:9%;
    left:50%;
    transform:translateX(-50%);
    border-radius:50%;

    background:
        radial-gradient(circle at 35% 30%,#ffffff,#e2edf7 55%,#a5bad0 100%);

    box-shadow:
        0 0 40px rgba(220,235,255,.55),
        0 0 130px rgba(120,170,230,.3);
}

.moon-glow{
    position:absolute;
    width:600px;
    height:600px;
    top:-100px;
    left:50%;
    transform:translateX(-50%);
    border-radius:50%;

    background:
        radial-gradient(circle,rgba(150,190,240,.18),transparent 65%);
}

.stars{
    position:absolute;
    inset:0;

    background-image:
        radial-gradient(#fff 1px,transparent 1px),
        radial-gradient(#b9d7ff 1px,transparent 1px);

    background-size:90px 90px,160px 160px;
    background-position:20px 30px,80px 70px;
    opacity:.45;

    animation:stars 35s linear infinite;
}

@keyframes stars{
    to{transform:translateY(-100px);}
}


/* =========================
   MAIN PINK DREAM
========================= */

.pink-dream{
    position:fixed;
    inset:0;
    opacity:0;
    pointer-events:none;

    background:
        radial-gradient(circle at 50% 35%,rgba(255,100,175,.7),transparent 28%),
        radial-gradient(circle at 15% 80%,rgba(220,30,120,.5),transparent 35%),
        radial-gradient(circle at 90% 15%,rgba(255,150,205,.4),transparent 35%),
        linear-gradient(150deg,#16020d,#4b092d,#9b285f,#36051f,#090108);

    transition:opacity 2s ease;
}


/* =========================
   SPECIAL ENTER BACKGROUND
========================= */

#enter{
    position:fixed;
    inset:0;
    z-index:1000;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;

    overflow:hidden;

    background:
        radial-gradient(circle at 50% 35%,
        rgba(255,125,190,.28),
        transparent 25%),

        radial-gradient(circle at 15% 80%,
        rgba(255,70,155,.18),
        transparent 30%),

        radial-gradient(circle at 85% 20%,
        rgba(170,110,255,.18),
        transparent 30%),

        linear-gradient(
            145deg,
            #120817,
            #24102f,
            #42172f,
            #16091f,
            #08050e
        );

    transition:opacity 1.5s ease;
}


/* dreamy light */

#enter::before{
    content:"";
    position:absolute;
    width:500px;
    height:500px;
    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(255,130,190,.18),
            transparent 68%
        );

    animation:enterGlow 6s ease-in-out infinite;
}

@keyframes enterGlow{

    0%,100%{
        transform:scale(.9);
        opacity:.5;
    }

    50%{
        transform:scale(1.2);
        opacity:1;
    }
}


/* little stars on enter */

.enter-stars{
    position:absolute;
    inset:0;

    background-image:
        radial-gradient(#fff 1px,transparent 1px),
        radial-gradient(#ffc9e5 1px,transparent 1px);

    background-size:110px 110px,170px 170px;

    opacity:.28;

    animation:enterStars 30s linear infinite;
}

@keyframes enterStars{
    to{
        transform:translateY(-80px);
    }
}


/* =========================
   ENTER FLOATING WORDS
========================= */

.enter-float{
    position:absolute;

    bottom:-60px;

    pointer-events:none;

    z-index:2;

    white-space:nowrap;

    animation:
        enterFloat
        linear
        forwards;

    text-shadow:
        0 0 15px rgba(255,100,180,.9),
        0 0 30px rgba(255,70,150,.4);
}

@keyframes enterFloat{

    0%{
        opacity:0;
        transform:
            translateY(0)
            translateX(0)
            rotate(0);
    }

    12%{
        opacity:.9;
    }

    100%{
        opacity:0;

        transform:
            translateY(-115vh)
            translateX(var(--move))
            rotate(var(--rotate));
    }
}


/* =========================
   ENTER CONTENT
========================= */

.enter-content{
    position:relative;
    z-index:10;

    animation:appear 2s ease;
}

@keyframes appear{

    from{
        opacity:0;
        transform:translateY(25px) scale(.96);
    }

    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

.enter-small{
    font-family:Arial,sans-serif;
    font-size:9px;
    letter-spacing:7px;
    color:#ffd4e7;
    margin-bottom:30px;
    opacity:.75;
}

.enter-heart{
    font-size:70px;

    animation:beat 1.8s infinite;

    filter:
        drop-shadow(0 0 30px rgba(255,90,170,.8));
}

@keyframes beat{

    50%{
        transform:scale(1.13);
    }

}

.enter-name{
    margin-top:20px;
    font-size:45px;
    font-weight:normal;

    color:#ffb7d6;

    text-shadow:
        0 0 15px rgba(255,90,170,.7),
        0 0 45px rgba(255,70,150,.4);
}

.enter-date{
    margin-top:10px;
    font-family:Arial,sans-serif;
    font-size:9px;
    letter-spacing:7px;
    opacity:.4;
}

.enter-button{
    margin-top:45px;

    padding:14px 28px;

    border-radius:40px;

    background:
        rgba(255,255,255,.06);

    border:
        1px solid rgba(255,190,220,.35);

    color:white;

    font-family:Arial,sans-serif;

    font-size:10px;

    letter-spacing:4px;

    cursor:pointer;

    transition:.5s;

    box-shadow:
        0 0 25px rgba(255,80,160,.12);
}

.enter-button:hover{

    background:
        rgba(255,255,255,.13);

    transform:scale(1.05);

    box-shadow:
        0 0 35px rgba(255,80,160,.3);
}


/* =========================
   MAIN SCREEN
========================= */

#main{
    position:fixed;
    inset:0;

    z-index:10;

    display:flex;

    align-items:center;
    justify-content:center;

    text-align:center;

    opacity:0;

    pointer-events:none;

    transition:opacity 2s ease;
}

.main-content{
    position:relative;
    z-index:20;
    margin-top:-40px;
}

.main-heart{
    font-size:55px;

    animation:beat 1.7s infinite;

    filter:
        drop-shadow(0 0 35px rgba(255,70,150,.9));
}

.name{
    margin-top:15px;

    font-size:clamp(65px,18vw,110px);

    font-weight:normal;

    color:#ffb2d3;

    text-shadow:
        0 0 15px rgba(255,70,150,.7),
        0 0 50px rgba(255,40,140,.45);
}

.be-mine{
    margin-top:10px;

    font-size:25px;

    font-style:italic;

    color:#ffe2ed;

    letter-spacing:2px;
}

.message{
    margin-top:35px;

    font-family:Arial,sans-serif;

    font-size:11px;

    letter-spacing:3px;

    color:#ffd1e2;

    opacity:.75;
}


/* =========================
   GIFT
========================= */

.gift-area{
    position:absolute;

    bottom:55px;

    left:0;
    right:0;

    z-index:30;

    text-align:center;
}

.gift{
    font-size:72px;

    cursor:pointer;

    display:inline-block;

    filter:
        drop-shadow(0 0 30px rgba(255,100,180,.9));

    animation:
        gift 2s ease-in-out infinite;
}

@keyframes gift{

    0%,100%{
        transform:translateY(0) rotate(0);
    }

    50%{
        transform:translateY(-12px) rotate(3deg);
    }
}

.gift-text{
    margin-top:10px;

    font-family:Arial,sans-serif;

    font-size:9px;

    letter-spacing:4px;

    color:#ffd5e5;

    opacity:.55;
}


/* =========================
   FLOATING EMOJIS
========================= */

.float{
    position:fixed;

    bottom:-60px;

    z-index:50;

    pointer-events:none;

    animation:
        floatUp
        linear
        forwards;

    text-shadow:
        0 0 15px rgba(255,90,170,.9);
}

@keyframes floatUp{

    0%{
        opacity:0;

        transform:
            translateY(0)
            translateX(0)
            rotate(0);
    }

    12%{
        opacity:1;
    }

    100%{
        opacity:0;

        transform:
            translateY(-115vh)
            translateX(var(--x))
            rotate(var(--r));
    }
}


/* =========================
   I LOVE YOU FLOAT
========================= */

.love-text{
    position:fixed;

    bottom:-50px;

    z-index:45;

    pointer-events:none;

    color:#fff0f6;

    font-size:17px;

    font-style:italic;

    white-space:nowrap;

    text-shadow:
        0 0 18px rgba(255,80,160,.9);

    animation:
        loveUp
        8s
        linear
        forwards;
}

@keyframes loveUp{

    0%{
        opacity:0;

        transform:
            translateY(0)
            translateX(0);
    }

    15%{
        opacity:.9;
    }

    100%{
        opacity:0;

        transform:
            translateY(-115vh)
            translateX(var(--move));
    }
}


/* =========================
   FINAL MESSAGE
========================= */

#final{
    position:fixed;
    inset:0;

    z-index:100;

    display:none;

    align-items:center;
    justify-content:center;

    text-align:center;

    padding:30px;

    background:
        rgba(20,0,12,.65);

    backdrop-filter:blur(12px);

    animation:
        finalAppear 1.5s ease;
}

@keyframes finalAppear{

    from{
        opacity:0;
    }

    to{
        opacity:1;
    }
}

.final-box{
    animation:
        finalScale 1.2s ease;
}

@keyframes finalScale{

    from{
        transform:scale(.7);
    }

    to{
        transform:scale(1);
    }
}

.final-heart{
    font-size:65px;

    animation:
        beat 1.5s infinite;
}

.final-name{
    margin-top:20px;

    font-size:48px;

    color:#ffb2d3;

    text-shadow:
        0 0 30px rgba(255,70,150,.8);
}

.final-title{
    margin-top:15px;

    font-size:30px;

    font-style:italic;

    color:white;
}

.final-text{
    margin-top:25px;

    font-family:Arial,sans-serif;

    font-size:14px;

    line-height:1.8;

    color:#ffd9e7;
}

.final-date{
    margin-top:30px;

    font-family:Arial,sans-serif;

    font-size:9px;

    letter-spacing:7px;

    opacity:.45;
}

.close{
    margin-top:35px;

    font-family:Arial,sans-serif;

    font-size:8px;

    letter-spacing:4px;

    opacity:.35;

    cursor:pointer;
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .moon{
        width:175px;
        height:175px;
        top:11%;
    }

    .name{
        font-size:68px;
    }

    .gift{
        font-size:65px;
    }

}

</style>

</head>

<body>


<!-- NIGHT -->

<div class="night">

    <div class="moon-glow"></div>

    <div class="moon"></div>

    <div class="stars"></div>

</div>


<!-- MAIN PINK DREAM -->

<div
    class="pink-dream"
    id="pink"
></div>


<!-- =========================
     SPECIAL ENTER SCREEN
========================= -->

<div id="enter">

    <div class="enter-stars"></div>

    <div class="enter-content">

        <div class="enter-small">
            FOR YOU
        </div>

        <div class="enter-heart">
            ❤️
        </div>

        <div class="enter-name">
            Najwa
        </div>

        <div class="enter-date">
            8 • 8
        </div>

        <button
            class="enter-button"
            onclick="enterSite()"
        >
            TAP TO ENTER
        </button>

    </div>

</div>


<!-- MUSIC -->

<audio
    id="music"
    loop
>

    <source
        src="music.mp3"
        type="audio/mpeg"
    >

</audio>


<!-- =========================
     MAIN
========================= -->

<div id="main">

    <div class="main-content">

        <div class="main-heart">
            ❤️
        </div>

        <div class="name">
            Najwa
        </div>

        <div class="be-mine">
            Be mine.
        </div>

        <div class="message">
            YOU HAVE MY HEART
        </div>

    </div>


    <div class="gift-area">

        <div
            class="gift"
            onclick="openGift()"
        >
            🎁
        </div>

        <div class="gift-text">
            TAP THE GIFT
        </div>

    </div>

</div>


<!-- =========================
     FINAL
========================= -->

<div id="final">

    <div class="final-box">

        <div class="final-heart">
            ❤️
        </div>

        <div class="final-name">
            Najwa
        </div>

        <div class="final-title">
            Be Mine.
        </div>

        <div class="final-text">

            I love you.
            <br>
            I chose my heart.
            <br>
            And it chose you.

        </div>

        <div class="final-date">
            8 • 8
        </div>

        <div
            class="close"
            onclick="closeFinal()"
        >
            TAP TO CLOSE
        </div>

    </div>

</div>


<script>


/* =========================
   ENTER FLOATING EFFECT
========================= */

function createEnterFloat(){

    const item =
        document.createElement("div");

    item.className="enter-float";


    const things=[

        "❤️",
        "💗",
        "💕",
        "💖",
        "💘",
        "💞",
        "💓",
        "💝",
        "🌸",
        "🌸",
        "✨",
        "♡",
        "I LOVE YOU",
        "MUAH ❤️"

    ];


    item.innerHTML=
        things[
            Math.floor(
                Math.random()*things.length
            )
        ];


    item.style.left=
        Math.random()*100+"vw";


    item.style.fontSize=
        (
            12+
            Math.random()*20
        )+"px";


    item.style.setProperty(
        "--move",
        (
            Math.random()*180-90
        )+"px"
    );


    item.style.setProperty(
        "--rotate",
        (
            Math.random()*40-20
        )+"deg"
    );


    item.style.animationDuration=
        (
            7+
            Math.random()*6
        )+"s";


    document
        .getElementById("enter")
        .appendChild(item);


    setTimeout(function(){

        item.remove();

    },14000);

}


/* floating things only on enter screen */

setInterval(
    createEnterFloat,
    700
);


/* =========================
   ENTER
========================= */

function enterSite(){

    const enter =
        document.getElementById("enter");

    const main =
        document.getElementById("main");

    const pink =
        document.getElementById("pink");


    enter.style.opacity="0";


    setTimeout(function(){

        enter.style.display="none";

        pink.style.opacity="1";

        main.style.opacity="1";

        main.style.pointerEvents="auto";

    },1200);

}


/* =========================
   GIFT
========================= */

function openGift(){

    const music =
        document.getElementById("music");

    music.volume=.65;

    music.play().catch(()=>{});


    for(
        let i=0;
        i<100;
        i++
    ){

        setTimeout(
            createFloat,
            i*35
        );

    }


    for(
        let i=0;
        i<18;
        i++
    ){

        setTimeout(
            createLove,
            i*300
        );

    }


    setTimeout(function(){

        document
            .getElementById("final")
            .style.display="flex";

    },2800);

}


/* =========================
   FLOATING EMOJIS
========================= */

function createFloat(){

    const item =
        document.createElement("div");

    item.className="float";


    const emojis=[

        "❤️",
        "💗",
        "💕",
        "💖",
        "💘",
        "💞",
        "💓",
        "💝",
        "🌸",
        "✨",
        "♡"

    ];


    item.innerHTML=
        emojis[
            Math.floor(
                Math.random()*emojis.length
            )
        ];


    item.style.left=
        Math.random()*100+"vw";


    item.style.fontSize=
        (
            12+
            Math.random()*28
        )+"px";


    item.style.setProperty(
        "--x",
        (
            Math.random()*220-110
        )+"px"
    );


    item.style.setProperty(
        "--r",
        (
            Math.random()*720-360
        )+"deg"
    );


    item.style.animationDuration=
        (
            5+
            Math.random()*6
        )+"s";


    document.body.appendChild(item);


    setTimeout(function(){

        item.remove();

    },13000);

}


/* =========================
   I LOVE YOU
========================= */

function createLove(){

    const love =
        document.createElement("div");

    love.className="love-text";

    love.innerHTML=
        "I LOVE YOU ❤️";


    love.style.left=
        Math.random()*80+"vw";


    love.style.setProperty(
        "--move",
        (
            Math.random()*180-90
        )+"px"
    );


    love.style.animationDuration=
        (
            7+
            Math.random()*4
        )+"s";


    document.body.appendChild(love);


    setTimeout(function(){

        love.remove();

    },12000);

}


/* =========================
   BACKGROUND EMOJIS
========================= */

setInterval(
    createFloat,
    1600
);


/* =========================
   CLOSE FINAL
========================= */

function closeFinal(){

    document
        .getElementById("final")
        .style.display="none";

}

</script>

</body>
</html>

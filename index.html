<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Najwa ❤️</title>

<style>

/* =========================
   RESET
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    overflow:hidden;
    background:#18030e;
    color:white;
    font-family:Georgia,serif;
}


/* =========================
   DREAMY PINK BACKGROUND
========================= */

.background{
    position:fixed;
    inset:0;
    overflow:hidden;

    background:
        radial-gradient(
            circle at 50% 45%,
            rgba(255,135,185,.75),
            transparent 28%
        ),
        radial-gradient(
            circle at 15% 20%,
            rgba(255,80,150,.45),
            transparent 30%
        ),
        radial-gradient(
            circle at 85% 75%,
            rgba(188,55,125,.5),
            transparent 35%
        ),
        linear-gradient(
            135deg,
            #21040f,
            #741a45,
            #d84f87,
            #5b1235,
            #12020b
        );

    z-index:-10;
}


/* Moving pink lights */

.light{
    position:absolute;

    width:300px;
    height:300px;

    border-radius:50%;

    background:
        rgba(255,170,210,.18);

    filter:blur(70px);

    animation:
        moveLight 12s ease-in-out infinite alternate;
}

.light:nth-child(1){
    top:-100px;
    left:-100px;
}

.light:nth-child(2){
    right:-100px;
    bottom:-80px;

    animation-delay:3s;
}

.light:nth-child(3){
    top:40%;
    left:40%;

    width:180px;
    height:180px;

    animation-delay:6s;
}

@keyframes moveLight{

    0%{
        transform:translate(0,0) scale(1);
    }

    50%{
        transform:translate(100px,60px) scale(1.3);
    }

    100%{
        transform:translate(-50px,-80px) scale(.9);
    }
}


/* =========================
   STARS
========================= */

.stars{
    position:absolute;
    inset:0;

    background-image:
        radial-gradient(
            rgba(255,255,255,.8) 1px,
            transparent 1px
        ),
        radial-gradient(
            rgba(255,210,230,.6) 1px,
            transparent 1px
        );

    background-size:
        90px 90px,
        150px 150px;

    opacity:.35;

    animation:
        starsMove 30s linear infinite;
}

@keyframes starsMove{

    from{
        transform:translateY(0);
    }

    to{
        transform:translateY(-100px);
    }
}


/* =========================
   ENTER SCREEN
========================= */

#enter{
    position:fixed;
    inset:0;

    z-index:1000;

    display:flex;
    justify-content:center;
    align-items:center;

    text-align:center;

    background:
        radial-gradient(
            circle at center,
            #ff9fc5,
            #a72d61 45%,
            #230511 100%
        );

    transition:
        opacity 1.2s ease,
        visibility 1.2s ease;
}

.enter-content{
    animation:
        enterAppear 2s ease;
}

@keyframes enterAppear{

    from{
        opacity:0;
        transform:translateY(30px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

.enter-heart{
    font-size:80px;

    filter:
        drop-shadow(
            0 0 35px
            #ff8dbb
        );

    animation:
        heartbeat 1.5s infinite;
}

@keyframes heartbeat{

    50%{
        transform:scale(1.15);
    }
}

.enter-title{
    margin-top:25px;

    font-size:38px;

    font-weight:normal;
}

.enter-date{
    margin-top:12px;

    font-family:Arial,sans-serif;

    font-size:10px;

    letter-spacing:7px;

    opacity:.6;
}

.enter-button{

    margin-top:35px;

    padding:15px 30px;

    border-radius:40px;

    border:
        1px solid
        rgba(255,255,255,.35);

    background:
        rgba(255,255,255,.12);

    color:white;

    font-size:14px;

    cursor:pointer;

    backdrop-filter:blur(12px);

    transition:.4s;
}

.enter-button:hover{
    transform:scale(1.07);

    background:
        rgba(255,255,255,.2);
}


/* =========================
   MAIN
========================= */

.main{
    position:relative;

    width:100vw;
    height:100vh;

    display:flex;

    justify-content:center;
    align-items:center;

    text-align:center;
}


/* =========================
   MAIN GLOW
========================= */

.center-glow{

    position:absolute;

    width:500px;
    height:500px;

    border-radius:50%;

    background:
        rgba(255,130,185,.16);

    filter:blur(80px);

    animation:
        centerPulse 5s ease-in-out infinite;

    pointer-events:none;
}

@keyframes centerPulse{

    50%{
        transform:scale(1.2);
        opacity:.7;
    }
}


/* =========================
   MAIN TEXT
========================= */

.content{
    position:relative;

    z-index:30;

    padding:30px;
}

.date{

    font-family:Arial,sans-serif;

    font-size:11px;

    letter-spacing:8px;

    opacity:.6;

    margin-bottom:25px;
}

.heart{

    font-size:70px;

    filter:
        drop-shadow(
            0 0 35px
            #ff5798
        );

    animation:
        heartbeat 1.6s infinite;
}

h1{

    margin-top:12px;

    font-size:
        clamp(
            55px,
            15vw,
            95px
        );

    font-weight:normal;

    background:
        linear-gradient(
            90deg,
            #fff,
            #ffd4e5,
            #fff,
            #ffb5d2
        );

    background-size:300%;

    -webkit-background-clip:text;

    -webkit-text-fill-color:transparent;

    animation:
        shine 5s linear infinite;
}

@keyframes shine{

    to{
        background-position:
            300% center;
    }
}

.be-mine{

    margin-top:10px;

    font-size:28px;

    font-style:italic;

    color:#fff;

    text-shadow:
        0 0 20px
        rgba(255,150,195,.8);
}

.small-line{

    margin-top:18px;

    font-family:Arial,sans-serif;

    font-size:10px;

    letter-spacing:3px;

    opacity:.45;
}


/* =========================
   FLOATING PICTURES
========================= */

.photo{

    position:absolute;

    width:145px;
    height:190px;

    padding:6px;

    border-radius:18px;

    background:
        rgba(255,255,255,.9);

    box-shadow:
        0 20px 60px
        rgba(0,0,0,.45);

    opacity:.82;

    z-index:5;

    pointer-events:none;

    animation:
        photoFloat
        var(--duration)
        ease-in-out
        infinite alternate;
}

.photo img{

    width:100%;
    height:100%;

    object-fit:cover;

    border-radius:13px;
}

.photo.one{

    left:5%;
    top:13%;

    --duration:7s;

    transform:rotate(-12deg);
}

.photo.two{

    right:5%;
    top:18%;

    --duration:8s;

    transform:rotate(10deg);
}

.photo.three{

    left:9%;
    bottom:8%;

    --duration:9s;

    transform:rotate(8deg);
}

.photo.four{

    right:8%;
    bottom:10%;

    --duration:7.5s;

    transform:rotate(-10deg);
}

.photo.five{

    left:50%;
    top:5%;

    width:105px;
    height:135px;

    opacity:.6;

    --duration:10s;

    transform:
        translateX(-50%)
        rotate(5deg);
}

@keyframes photoFloat{

    0%{
        transform:
            translateY(0)
            rotate(var(--rotation));
    }

    100%{
        transform:
            translateY(-22px)
            rotate(var(--rotation));
    }
}


/* =========================
   FLOATING LOVE
========================= */

.float{

    position:fixed;

    bottom:-50px;

    z-index:40;

    pointer-events:none;

    animation:
        floatUp
        linear
        forwards;

    text-shadow:
        0 0 15px
        rgba(255,130,190,.9);
}

@keyframes floatUp{

    0%{
        opacity:0;

        transform:
            translateY(0)
            translateX(0)
            rotate(0);
    }

    15%{
        opacity:.9;
    }

    100%{
        opacity:0;

        transform:
            translateY(-110vh)
            translateX(var(--move))
            rotate(var(--rotate));
    }
}


/* =========================
   I LOVE YOU FLOATING
========================= */

.love-text{

    position:fixed;

    bottom:-40px;

    z-index:39;

    pointer-events:none;

    font-size:16px;

    font-style:italic;

    color:#ffe0ec;

    text-shadow:
        0 0 15px
        rgba(255,120,180,.9);

    animation:
        textUp
        9s
        linear
        forwards;
}

@keyframes textUp{

    0%{
        opacity:0;

        transform:
            translateY(0)
            translateX(0);
    }

    15%{
        opacity:.75;
    }

    100%{
        opacity:0;

        transform:
            translateY(-110vh)
            translateX(var(--move));
    }
}


/* =========================
   GIFT
========================= */

.gift{

    position:absolute;

    bottom:30px;

    left:50%;

    transform:
        translateX(-50%);

    z-index:50;

    text-align:center;
}

.gift-icon{

    font-size:45px;

    cursor:pointer;

    display:inline-block;

    filter:
        drop-shadow(
            0 0 20px
            rgba(255,130,190,.7)
        );

    animation:
        giftFloat 2s infinite;
}

@keyframes giftFloat{

    50%{
        transform:
            translateY(-7px);
    }
}

.gift-label{

    margin-top:4px;

    font-family:Arial,sans-serif;

    font-size:8px;

    letter-spacing:3px;

    opacity:.45;
}


/* =========================
   SECRET
========================= */

#secret{

    position:fixed;

    inset:0;

    z-index:200;

    display:none;

    justify-content:center;
    align-items:center;

    text-align:center;

    padding:25px;

    background:
        rgba(50,5,25,.78);

    backdrop-filter:
        blur(15px);
}

.secret-box{

    max-width:400px;

    padding:45px 30px;

    border-radius:30px;

    background:
        rgba(255,150,195,.13);

    border:
        1px solid
        rgba(255,255,255,.2);

    box-shadow:
        0 30px 100px
        rgba(0,0,0,.5);

    animation:
        reveal 1s ease;
}

@keyframes reveal{

    from{
        opacity:0;
        transform:scale(.8);
    }

    to{
        opacity:1;
        transform:scale(1);
    }
}

.secret-heart{
    font-size:55px;
}

.secret-title{

    margin-top:15px;

    font-size:36px;

    font-weight:normal;
}

.secret-name{

    margin-top:20px;

    font-size:22px;

    color:#ffd3e3;
}

.close{

    margin-top:28px;

    font-family:Arial,sans-serif;

    font-size:9px;

    letter-spacing:3px;

    opacity:.4;

    cursor:pointer;
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .photo{
        width:100px;
        height:135px;
    }

    .photo.one{
        left:1%;
        top:10%;
    }

    .photo.two{
        right:1%;
        top:13%;
    }

    .photo.three{
        left:2%;
        bottom:10%;
    }

    .photo.four{
        right:2%;
        bottom:12%;
    }

    .photo.five{
        width:80px;
        height:105px;
        top:7%;
    }

    .content{
        padding:20px;
    }

    .heart{
        font-size:60px;
    }

    .be-mine{
        font-size:24px;
    }

}

</style>
</head>


<body>


<!-- =========================
     BACKGROUND
========================= -->

<div class="background">

    <div class="light"></div>
    <div class="light"></div>
    <div class="light"></div>

    <div class="stars"></div>

</div>


<!-- =========================
     ENTER
========================= -->

<div id="enter">

    <div class="enter-content">

        <div class="enter-heart">
            ❤️
        </div>

        <div class="enter-title">
            For Najwa
        </div>

        <div class="enter-date">
            8 • 8
        </div>

        <button
            class="enter-button"
            onclick="enterLove()"
        >
            Tap to enter ❤️
        </button>

    </div>

</div>


<!-- =========================
     MUSIC
========================= -->

<audio
    id="music"
    loop
    preload="auto"
>

    <source
        src="music.mp3"
        type="audio/mpeg"
    >

</audio>


<!-- =========================
     MAIN
========================= -->

<main class="main">


    <div class="center-glow"></div>


    <!-- FLOATING PHOTOS -->

    <div class="photo one">
        <img src="love1.jpg" alt="Love">
    </div>

    <div class="photo two">
        <img src="love2.jpg" alt="Love">
    </div>

    <div class="photo three">
        <img src="love3.jpg" alt="Love">
    </div>

    <div class="photo four">
        <img src="love4.jpg" alt="Love">
    </div>

    <div class="photo five">
        <img src="love5.jpg" alt="Love">
    </div>


    <!-- CENTER -->

    <div class="content">

        <div class="date">
            8 • 8
        </div>

        <div class="heart">
            ❤️
        </div>

        <h1>
            Najwa
        </h1>

        <div class="be-mine">
            Be Mine.
        </div>

        <div class="small-line">
            JUST FOR YOU
        </div>

    </div>


    <!-- GIFT -->

    <div class="gift">

        <div
            class="gift-icon"
            onclick="openGift()"
        >
            🎁
        </div>

        <div class="gift-label">
            TAP
        </div>

    </div>


</main>


<!-- =========================
     SECRET
========================= -->

<div id="secret">

    <div class="secret-box">

        <div class="secret-heart">
            ❤️
        </div>

        <div class="secret-title">
            Be Mine.
        </div>

        <div class="secret-name">
            Naj ❤️
        </div>

        <div
            class="close"
            onclick="closeGift()"
        >
            TAP TO CLOSE
        </div>

    </div>

</div>


<script>


/* =========================
   ENTER WEBSITE
========================= */

function enterLove(){

    const screen =
        document.getElementById(
            "enter"
        );

    const music =
        document.getElementById(
            "music"
        );


    music.volume=.65;


    /*
       Because she tapped the button,
       iPhone allows the music to play.
    */

    music.play()
    .catch(function(){});


    screen.style.opacity="0";

    setTimeout(function(){

        screen.style.visibility=
            "hidden";

    },1200);


    /*
       Start a little stronger
       floating effect after entry.
    */

    for(
        let i=0;
        i<15;
        i++
    ){

        setTimeout(
            createFloat,
            i*100
        );

    }

}


/* =========================
   GIFT
========================= */

function openGift(){

    document
        .getElementById("secret")
        .style.display="flex";


    /*
       Romantic burst.
    */

    for(
        let i=0;
        i<35;
        i++
    ){

        setTimeout(
            createFloat,
            i*60
        );

    }


    for(
        let i=0;
        i<8;
        i++
    ){

        setTimeout(
            createLoveText,
            i*150
        );

    }

}


function closeGift(){

    document
        .getElementById("secret")
        .style.display="none";

}


/* =========================
   FLOATING EMOJIS
========================= */

function createFloat(){

    const item =
        document.createElement(
            "div"
        );

    item.className="float";


    const emojis=[

        "❤️",
        "💗",
        "💕",
        "💖",
        "💘",
        "💞",
        "💓",
        "💝",
        "🌸"

    ];


    item.innerHTML=
        emojis[
            Math.floor(
                Math.random()
                * emojis.length
            )
        ];


    item.style.left=
        Math.random()*100+"vw";


    item.style.fontSize=
        (
            14+
            Math.random()*25
        )+"px";


    item.style.setProperty(
        "--move",
        (
            Math.random()*180-90
        )+"px"
    );


    item.style.setProperty(
        "--rotate",
        (
            Math.random()*360
        )+"deg"
    );


    item.style.animationDuration=
        (
            6+
            Math.random()*7
        )+"s";


    document.body.appendChild(
        item
    );


    setTimeout(
        function(){

            item.remove();

        },
        15000
    );

}


/* =========================
   FLOATING WORDS
========================= */

function createLoveText(){

    const text =
        document.createElement(
            "div"
        );

    text.className=
        "love-text";


    text.innerHTML=
        "I love you ❤️";


    text.style.left=
        Math.random()*80+"vw";


    text.style.setProperty(
        "--move",
        (
            Math.random()*160-80
        )+"px"
    );


    document.body.appendChild(
        text
    );


    setTimeout(
        function(){

            text.remove();

        },
        10000
    );

}


/* =========================
   CONTINUOUS EFFECTS
========================= */

setInterval(
    createFloat,
    850
);


setInterval(
    function(){

        if(
            Math.random()<.5
        ){

            createLoveText();

        }

    },
    3000
);

</script>

</body>
</html>

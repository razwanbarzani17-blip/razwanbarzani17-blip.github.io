<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Najwa ❤️</title>

<style>

/* =====================================
   RESET
===================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
}

body{
    overflow:hidden;
    font-family:Georgia,serif;
    color:white;
    background:#02050b;
}


/* =====================================
   OPENING NIGHT
===================================== */

.night{
    position:fixed;
    inset:0;
    z-index:-10;
    overflow:hidden;

    background:
        radial-gradient(
            circle at 50% 25%,
            #1a3155 0%,
            #0b192d 30%,
            #030914 70%,
            #010207 100%
        );

    transition:opacity 2s ease;
}


/* Moon */

.moon{
    position:absolute;

    width:220px;
    height:220px;

    top:9%;
    left:50%;

    transform:translateX(-50%);

    border-radius:50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #ffffff,
            #e1edf7 55%,
            #a4b9cf 100%
        );

    box-shadow:
        0 0 45px rgba(220,235,255,.6),
        0 0 140px rgba(120,175,235,.32);
}

.moon-glow{
    position:absolute;

    width:650px;
    height:650px;

    top:-120px;
    left:50%;

    transform:translateX(-50%);

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(150,195,245,.2),
            transparent 65%
        );
}


/* Stars */

.stars{
    position:absolute;
    inset:0;

    background-image:
        radial-gradient(
            #fff 1px,
            transparent 1px
        ),
        radial-gradient(
            #c7ddff 1px,
            transparent 1px
        );

    background-size:
        90px 90px,
        170px 170px;

    background-position:
        20px 30px,
        70px 80px;

    opacity:.45;

    animation:
        starsMove 35s linear infinite;
}

@keyframes starsMove{

    to{
        transform:translateY(-120px);
    }
}


/* =====================================
   FANTASY WORLD
===================================== */

.fantasy{

    position:fixed;
    inset:0;

    z-index:-9;

    opacity:0;

    overflow:hidden;

    background:

        radial-gradient(
            ellipse at 50% 30%,
            rgba(135,110,255,.55),
            transparent 32%
        ),

        radial-gradient(
            ellipse at 10% 80%,
            rgba(65,120,220,.4),
            transparent 35%
        ),

        radial-gradient(
            ellipse at 90% 75%,
            rgba(165,70,180,.35),
            transparent 35%
        ),

        linear-gradient(
            180deg,
            #090b30 0%,
            #17124b 35%,
            #24134b 60%,
            #09051c 100%
        );

    transition:
        opacity 2.5s ease;
}


/* fantasy moon */

.fantasy-moon{

    position:absolute;

    width:190px;
    height:190px;

    top:8%;
    left:50%;

    transform:translateX(-50%);

    border-radius:50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #fff,
            #f5e9ff 50%,
            #d5b8e9 100%
        );

    box-shadow:

        0 0 35px
        rgba(255,240,255,.7),

        0 0 100px
        rgba(160,130,255,.6),

        0 0 180px
        rgba(100,120,255,.25);
}


/* clouds */

.cloud{

    position:absolute;

    width:320px;
    height:75px;

    border-radius:100px;

    background:
        rgba(190,205,255,.08);

    filter:blur(12px);

    animation:
        cloudMove
        18s
        ease-in-out
        infinite alternate;
}

.cloud:before,
.cloud:after{

    content:"";

    position:absolute;

    border-radius:50%;

    background:
        rgba(200,215,255,.09);
}

.cloud:before{

    width:130px;
    height:130px;

    left:45px;
    bottom:-5px;
}

.cloud:after{

    width:100px;
    height:100px;

    right:45px;
    bottom:0;
}

.cloud.one{

    top:33%;
    left:-80px;
}

.cloud.two{

    top:52%;
    right:-100px;

    animation-delay:5s;
}

.cloud.three{

    top:72%;
    left:-150px;

    transform:scale(.7);

    animation-delay:9s;
}

@keyframes cloudMove{

    from{
        transform:translateX(-30px);
    }

    to{
        transform:translateX(120px);
    }
}


/* fantasy stars */

.fantasy-stars{

    position:absolute;
    inset:0;

    background-image:

        radial-gradient(
            #fff 1px,
            transparent 1px
        ),

        radial-gradient(
            #dcbfff 1px,
            transparent 1px
        );

    background-size:
        75px 75px,
        135px 135px;

    opacity:.5;
}


/* glowing horizon */

.horizon{

    position:absolute;

    width:100%;
    height:45%;

    bottom:-20%;

    background:
        radial-gradient(
            ellipse,
            rgba(120,80,220,.35),
            transparent 65%
        );

    filter:blur(30px);
}


/* =====================================
   ENTER SCREEN
===================================== */

#enter{

    position:fixed;
    inset:0;

    z-index:1000;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;

    background:#02050b;

    transition:
        opacity 1.5s ease;
}

.enter-content{
    animation:appear 2s ease;
}

@keyframes appear{

    from{
        opacity:0;
        transform:translateY(25px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

.enter-small{

    font-family:Arial,sans-serif;

    font-size:9px;

    letter-spacing:7px;

    color:#9eb5d0;

    margin-bottom:30px;
}

.enter-heart{

    font-size:70px;

    animation:beat 1.8s infinite;

    filter:
        drop-shadow(
            0 0 30px
            rgba(170,200,240,.7)
        );
}

@keyframes beat{

    50%{
        transform:scale(1.13);
    }
}

.enter-name{

    margin-top:20px;

    font-size:45px;

    font-weight:normal;
}

.enter-date{

    margin-top:10px;

    font-family:Arial,sans-serif;

    font-size:9px;

    letter-spacing:7px;

    opacity:.35;
}

.enter-button{

    margin-top:45px;

    padding:14px 28px;

    border-radius:40px;

    background:
        rgba(255,255,255,.04);

    border:
        1px solid
        rgba(200,220,240,.3);

    color:white;

    cursor:pointer;

    font-family:Arial,sans-serif;

    font-size:10px;

    letter-spacing:4px;

    transition:.5s;
}

.enter-button:hover{

    background:
        rgba(255,255,255,.1);

    transform:scale(1.05);
}


/* =====================================
   MAIN
===================================== */

#main{

    position:fixed;
    inset:0;

    z-index:10;

    display:flex;

    align-items:center;
    justify-content:center;

    text-align:center;

    opacity:0;

    pointer-events:none;

    transition:
        opacity 2s ease;
}

.main-content{

    position:relative;

    z-index:20;

    margin-top:-40px;
}

.main-heart{

    font-size:55px;

    animation:beat 1.7s infinite;

    filter:
        drop-shadow(
            0 0 30px
            rgba(255,80,160,.8)
        );
}

.name{

    margin-top:15px;

    font-size:
        clamp(
            65px,
            18vw,
            110px
        );

    font-weight:normal;

    color:#f4b4ff;

    text-shadow:

        0 0 15px
        rgba(190,120,255,.9),

        0 0 50px
        rgba(150,80,255,.55);
}

.be-mine{

    margin-top:10px;

    font-size:25px;

    font-style:italic;

    color:#ffe6f3;

    letter-spacing:2px;
}

.message{

    margin-top:35px;

    font-family:Arial,sans-serif;

    font-size:10px;

    letter-spacing:4px;

    color:#d9caff;

    opacity:.75;
}


/* =====================================
   GIFT
===================================== */

.gift-area{

    position:absolute;

    bottom:50px;

    left:0;
    right:0;

    z-index:30;

    text-align:center;
}

.gift{

    font-size:72px;

    cursor:pointer;

    display:inline-block;

    filter:
        drop-shadow(
            0 0 35px
            rgba(180,110,255,.9)
        );

    animation:
        giftFloat
        2s
        ease-in-out
        infinite;
}

@keyframes giftFloat{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-12px);
    }
}

.gift-text{

    margin-top:8px;

    font-family:Arial,sans-serif;

    font-size:8px;

    letter-spacing:4px;

    color:#e5d8ff;

    opacity:.5;
}


/* =====================================
   FLOATING EMOJIS
===================================== */

.float{

    position:fixed;

    bottom:-60px;

    z-index:50;

    pointer-events:none;

    animation:
        floatUp
        linear
        forwards;

    text-shadow:
        0 0 18px
        rgba(210,110,255,.9);
}

@keyframes floatUp{

    0%{

        opacity:0;

        transform:
            translateY(0)
            translateX(0)
            rotate(0);
    }

    12%{
        opacity:1;
    }

    100%{

        opacity:0;

        transform:
            translateY(-115vh)
            translateX(var(--x))
            rotate(var(--r));
    }
}


/* =====================================
   I LOVE YOU
===================================== */

.love-text{

    position:fixed;

    bottom:-50px;

    z-index:45;

    pointer-events:none;

    color:#ffe8f3;

    font-size:17px;

    font-style:italic;

    white-space:nowrap;

    text-shadow:
        0 0 18px
        rgba(255,100,190,.9);

    animation:
        loveUp
        8s
        linear
        forwards;
}

@keyframes loveUp{

    0%{

        opacity:0;

        transform:
            translateY(0)
            translateX(0);
    }

    15%{
        opacity:.9;
    }

    100%{

        opacity:0;

        transform:
            translateY(-115vh)
            translateX(var(--move));
    }
}


/* =====================================
   MUAH
===================================== */

.muah{

    position:fixed;

    bottom:-50px;

    z-index:46;

    pointer-events:none;

    color:#ffd3e8;

    font-size:16px;

    font-style:italic;

    text-shadow:
        0 0 20px
        rgba(255,100,190,.9);

    animation:
        muahUp
        7s
        ease-out
        forwards;
}

@keyframes muahUp{

    0%{

        opacity:0;

        transform:
            translateY(0)
            scale(.7)
            rotate(-8deg);
    }

    15%{
        opacity:1;
    }

    100%{

        opacity:0;

        transform:
            translateY(-95vh)
            translateX(var(--move))
            scale(1.3)
            rotate(8deg);
    }
}


/* =====================================
   FINAL
===================================== */

#final{

    position:fixed;

    inset:0;

    z-index:100;

    display:none;

    align-items:center;
    justify-content:center;

    text-align:center;

    padding:30px;

    background:
        rgba(20,5,35,.5);

    backdrop-filter:
        blur(14px);

    animation:
        finalAppear
        1.5s
        ease;
}

@keyframes finalAppear{

    from{
        opacity:0;
    }

    to{
        opacity:1;
    }
}

.final-box{

    animation:
        finalScale
        1.2s
        ease;
}

@keyframes finalScale{

    from{
        transform:scale(.75);
    }

    to{
        transform:scale(1);
    }
}

.final-heart{

    font-size:65px;

    animation:
        beat
        1.5s
        infinite;
}

.final-name{

    margin-top:20px;

    font-size:48px;

    color:#f3b6ff;

    text-shadow:
        0 0 35px
        rgba(180,100,255,.8);
}

.final-title{

    margin-top:15px;

    font-size:30px;

    font-style:italic;

    color:white;
}

.final-text{

    margin-top:25px;

    font-family:Arial,sans-serif;

    font-size:14px;

    line-height:1.8;

    color:#eadcf5;
}

.final-date{

    margin-top:30px;

    font-family:Arial,sans-serif;

    font-size:9px;

    letter-spacing:7px;

    opacity:.45;
}

.close{

    margin-top:35px;

    font-family:Arial,sans-serif;

    font-size:8px;

    letter-spacing:4px;

    opacity:.35;

    cursor:pointer;
}


/* =====================================
   MOBILE
===================================== */

@media(max-width:600px){

    .moon{
        width:175px;
        height:175px;
        top:11%;
    }

    .fantasy-moon{
        width:150px;
        height:150px;
    }

    .name{
        font-size:68px;
    }

    .gift{
        font-size:65px;
    }

}

</style>

</head>


<body>


<!-- =====================================
     ORIGINAL NIGHT
===================================== -->

<div class="night">

    <div class="moon-glow"></div>

    <div class="moon"></div>

    <div class="stars"></div>

</div>


<!-- =====================================
     FANTASY WORLD
===================================== -->

<div
    class="fantasy"
    id="fantasy"
>

    <div class="fantasy-moon"></div>

    <div class="fantasy-stars"></div>

    <div class="cloud one"></div>
    <div class="cloud two"></div>
    <div class="cloud three"></div>

    <div class="horizon"></div>

</div>


<!-- =====================================
     ENTER
===================================== -->

<div id="enter">

    <div class="enter-content">

        <div class="enter-small">
            FOR YOU
        </div>

        <div class="enter-heart">
            ❤️
        </div>

        <div class="enter-name">
            Najwa
        </div>

        <div class="enter-date">
            8 • 8
        </div>

        <button
            class="enter-button"
            onclick="enterSite()"
        >
            TAP TO ENTER
        </button>

    </div>

</div>


<!-- =====================================
     MUSIC
===================================== -->

<audio
    id="music"
    loop
>

    <source
        src="music.mp3"
        type="audio/mpeg"
    >

</audio>


<!-- =====================================
     MAIN
===================================== -->

<div id="main">

    <div class="main-content">

        <div class="main-heart">
            ❤️
        </div>

        <div class="name">
            Najwa
        </div>

        <div class="be-mine">
            Be mine.
        </div>

        <div class="message">
            YOU HAVE MY HEART
        </div>

    </div>


    <!-- GIFT -->

    <div class="gift-area">

        <div
            class="gift"
            onclick="openGift()"
        >
            🎁
        </div>

        <div class="gift-text">
            TAP THE GIFT
        </div>

    </div>

</div>


<!-- =====================================
     FINAL
===================================== -->

<div id="final">

    <div class="final-box">

        <div class="final-heart">
            ❤️
        </div>

        <div class="final-name">
            Najwa
        </div>

        <div class="final-title">
            Be Mine.
        </div>

        <div class="final-text">

            I love you.
            <br>
            I chose my heart.
            <br>
            And it chose you.
            <br><br>
            Muah 💋

        </div>

        <div class="final-date">
            8 • 8
        </div>

        <div
            class="close"
            onclick="closeFinal()"
        >
            TAP TO CLOSE
        </div>

    </div>

</div>


<script>


/* =====================================
   ENTER
===================================== */

function enterSite(){

    const enter =
        document.getElementById("enter");

    const night =
        document.querySelector(".night");

    const fantasy =
        document.getElementById("fantasy");

    const main =
        document.getElementById("main");


    /* fade out opening */

    enter.style.opacity="0";


    setTimeout(function(){

        enter.style.display="none";


        /*
           The original moon disappears
           and the fantasy world appears.
        */

        night.style.opacity="0";

        fantasy.style.opacity="1";

        main.style.opacity="1";

        main.style.pointerEvents="auto";


    },1200);

}


/* =====================================
   GIFT
===================================== */

function openGift(){

    const music =
        document.getElementById("music");


    /* music starts after tap */

    music.volume=.65;

    music.play().catch(()=>{});


    /*
       BIG EMOJI WAVE
    */

    for(
        let i=0;
        i<130;
        i++
    ){

        setTimeout(
            createFloat,
            i*30
        );

    }


    /*
       I LOVE YOU
    */

    for(
        let i=0;
        i<20;
        i++
    ){

        setTimeout(
            createLove,
            i*250
        );

    }


    /*
       MUAH
    */

    for(
        let i=0;
        i<8;
        i++
    ){

        setTimeout(
            createMuah,
            i*500
        );

    }


    /*
       Final message
    */

    setTimeout(function(){

        document
            .getElementById("final")
            .style.display="flex";

    },3000);

}


/* =====================================
   EMOJIS
===================================== */

function createFloat(){

    const item =
        document.createElement("div");

    item.className="float";


    const emojis=[

        "❤️",
        "💗",
        "💕",
        "💖",
        "💘",
        "💞",
        "💓",
        "💝",
        "🌸",
        "✨",
        "♡"

    ];


    item.innerHTML =
        emojis[
            Math.floor(
                Math.random()
                *emojis.length
            )
        ];


    item.style.left =
        Math.random()*100+"vw";


    item.style.fontSize =
        (
            12+
            Math.random()*30
        )+"px";


    item.style.setProperty(
        "--x",
        (
            Math.random()*240-120
        )+"px"
    );


    item.style.setProperty(
        "--r",
        (
            Math.random()*720-360
        )+"deg"
    );


    item.style.animationDuration =
        (
            5+
            Math.random()*7
        )+"s";


    document.body.appendChild(item);


    setTimeout(function(){

        item.remove();

    },14000);

}


/* =====================================
   I LOVE YOU
===================================== */

function createLove(){

    const love =
        document.createElement("div");

    love.className="love-text";

    love.innerHTML=
        "I LOVE YOU ❤️";


    love.style.left =
        Math.random()*82+"vw";


    love.style.setProperty(
        "--move",
        (
            Math.random()*180-90
        )+"px"
    );


    love.style.animationDuration =
        (
            7+
            Math.random()*4
        )+"s";


    document.body.appendChild(love);


    setTimeout(function(){

        love.remove();

    },12000);

}


/* =====================================
   MUAH
===================================== */

function createMuah(){

    const muah =
        document.createElement("div");

    muah.className="muah";

    muah.innerHTML=
        "Muah 💋";


    muah.style.left =
        Math.random()*80+"vw";


    muah.style.setProperty(
        "--move",
        (
            Math.random()*180-90
        )+"px"
    );


    document.body.appendChild(muah);


    setTimeout(function(){

        muah.remove();

    },9000);

}


/* =====================================
   CONTINUOUS MAGIC
===================================== */

setInterval(
    createFloat,
    1800
);


/* =====================================
   CLOSE
===================================== */

function closeFinal(){

    document
        .getElementById("final")
        .style.display="none";

}

</script>

</body>
</html>

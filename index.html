<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Najwa ❤️</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    overflow-x:hidden;
    color:white;
    font-family:Georgia,serif;

    background:
        radial-gradient(
            circle at 50% 25%,
            #ffb6d5 0%,
            #f56f9f 25%,
            #c83f72 50%,
            #5a1635 78%,
            #17030d 100%
        );
}


/* SOFT GLOW */

.glow{
    position:fixed;
    width:420px;
    height:420px;
    border-radius:50%;
    background:rgba(255,190,220,.25);
    filter:blur(100px);
    pointer-events:none;
    z-index:0;
}

.glow.one{
    top:-200px;
    left:-180px;
}

.glow.two{
    bottom:-220px;
    right:-180px;
}


/* =========================
   ENTER SCREEN
========================= */

#enter{
    position:fixed;
    inset:0;
    z-index:9999;

    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;

    background:
        radial-gradient(
            circle at 50% 40%,
            #ffb1d0,
            #d94c7d 48%,
            #4d102c 100%
        );

    transition:opacity 1s ease;
}

.enter-box{
    padding:30px;
}

.enter-heart{
    font-size:78px;

    filter:
        drop-shadow(
            0 0 30px
            #ffb7d5
        );

    animation:heartbeat 1.5s infinite;
}

@keyframes heartbeat{
    50%{
        transform:scale(1.15);
    }
}

.enter-title{
    margin-top:22px;
    font-size:38px;
    font-weight:normal;
}

.enter-date{
    margin-top:12px;

    font-family:Arial,sans-serif;
    font-size:10px;
    letter-spacing:6px;

    opacity:.6;
}

.enter-button{
    margin-top:32px;

    padding:15px 30px;

    border-radius:40px;

    border:
        1px solid
        rgba(255,255,255,.35);

    background:
        rgba(255,255,255,.12);

    color:white;

    font-size:14px;

    cursor:pointer;

    backdrop-filter:blur(12px);

    transition:.3s;
}

.enter-button:hover{
    transform:scale(1.05);
}


/* =========================
   MAIN
========================= */

.main{
    position:relative;
    z-index:2;

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:25px 18px;
}

.card{
    width:100%;
    max-width:500px;

    text-align:center;

    padding:45px 25px;

    border-radius:35px;

    background:
        rgba(255,255,255,.10);

    border:
        1px solid
        rgba(255,255,255,.25);

    backdrop-filter:blur(20px);

    box-shadow:
        0 30px 90px
        rgba(60,0,30,.45);

    animation:appear 1.5s ease;
}

@keyframes appear{
    from{
        opacity:0;
        transform:translateY(25px) scale(.97);
    }

    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}


/* =========================
   DATE
========================= */

.date{
    font-family:Arial,sans-serif;

    font-size:10px;

    letter-spacing:7px;

    opacity:.55;

    margin-bottom:22px;
}


/* =========================
   HEART
========================= */

.big-heart{
    font-size:70px;

    filter:
        drop-shadow(
            0 0 30px
            rgba(255,80,150,.8)
        );

    animation:heartbeat 1.6s infinite;
}


/* =========================
   MAIN TEXT
========================= */

h1{
    margin-top:15px;

    font-size:
        clamp(
            55px,
            16vw,
            88px
        );

    font-weight:normal;

    background:
        linear-gradient(
            90deg,
            #fff,
            #ffe0eb,
            #fff
        );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.be-mine{
    margin-top:10px;

    font-size:27px;

    font-style:italic;

    color:#fff;

    letter-spacing:1px;

    text-shadow:
        0 0 20px
        rgba(255,150,190,.7);
}


/* =========================
   LOVE IMAGE
========================= */

.love-image{
    width:100%;

    height:220px;

    margin-top:32px;

    border-radius:25px;

    overflow:hidden;

    border:
        1px solid
        rgba(255,255,255,.2);

    box-shadow:
        0 20px 50px
        rgba(0,0,0,.35);
}

.love-image img{
    width:100%;
    height:100%;
    object-fit:cover;
}


/* =========================
   MUSIC
========================= */

.music-note{
    margin-top:18px;

    font-family:Arial,sans-serif;

    font-size:10px;

    letter-spacing:3px;

    opacity:.45;
}


/* =========================
   GIFT
========================= */

.gift-area{
    margin-top:32px;
}

.gift{
    display:inline-block;

    font-size:62px;

    cursor:pointer;

    filter:
        drop-shadow(
            0 0 25px
            rgba(255,150,200,.7)
        );

    animation:giftFloat 2s infinite;

    transition:.3s;
}

.gift:hover{
    transform:scale(1.1);
}

@keyframesgiftFloat{
    50%{
        transform:translateY(-7px);
    }
}

.gift-label{
    margin-top:8px;

    font-family:Arial,sans-serif;

    font-size:9px;

    letter-spacing:3px;

    opacity:.4;
}


/* =========================
   SURPRISE
========================= */

.secret{
    display:none;

    margin-top:30px;

    animation:reveal 1.2s ease;
}

@keyframes reveal{
    from{
        opacity:0;
        transform:scale(.85);
    }

    to{
        opacity:1;
        transform:scale(1);
    }
}

.secret-title{
    font-size:30px;

    font-weight:normal;

    color:white;
}

.secret-text{
    margin-top:14px;

    font-size:18px;

    line-height:1.7;

    color:#ffe4ee;
}

.signature{
    margin-top:15px;

    font-size:22px;

    color:#fff;
}


/* =========================
   MUSIC FALLBACK
========================= */

#musicHint{
    position:fixed;

    bottom:22px;

    left:50%;

    transform:translateX(-50%);

    z-index:100;

    padding:11px 18px;

    border-radius:30px;

    background:
        rgba(50,0,25,.75);

    border:
        1px solid
        rgba(255,255,255,.2);

    backdrop-filter:blur(12px);

    font-family:Arial,sans-serif;

    font-size:10px;

    letter-spacing:1px;

    opacity:0;

    pointer-events:none;

    transition:.5s;

    white-space:nowrap;
}

#musicHint.show{
    opacity:.8;
}


/* =========================
   FLOATING HEARTS + FLOWERS
========================= */

.float{
    position:fixed;

    bottom:-50px;

    z-index:10;

    pointer-events:none;

    animation:
        floatUp
        linear
        forwards;

    text-shadow:
        0 0 15px
        rgba(255,130,190,.9);
}

@keyframes floatUp{

    0%{
        opacity:0;

        transform:
            translateY(0)
            translateX(0)
            rotate(0deg);
    }

    15%{
        opacity:.9;
    }

    100%{
        opacity:0;

        transform:
            translateY(-110vh)
            translateX(var(--move))
            rotate(var(--rotate));
    }
}


/* =========================
   FLOATING I LOVE YOU
========================= */

.love-text{
    position:fixed;

    bottom:-40px;

    z-index:9;

    pointer-events:none;

    color:#ffe1ec;

    font-family:Georgia,serif;

    font-size:16px;

    font-style:italic;

    text-shadow:
        0 0 15px
        rgba(255,130,190,.9);

    animation:
        textUp
        linear
        forwards;
}

@keyframes textUp{

    0%{
        opacity:0;

        transform:
            translateY(0)
            translateX(0);
    }

    15%{
        opacity:.7;
    }

    100%{
        opacity:0;

        transform:
            translateY(-110vh)
            translateX(var(--move));
    }
}


/* FOOTER */

.footer{
    margin-top:28px;

    font-family:Arial,sans-serif;

    font-size:8px;

    letter-spacing:4px;

    opacity:.25;
}

</style>
</head>


<body>


<!-- SOFT LIGHT -->

<div class="glow one"></div>
<div class="glow two"></div>


<!-- =========================
     TAP TO ENTER
========================= -->

<div id="enter">

    <div class="enter-box">

        <div class="enter-heart">
            ❤️
        </div>

        <div class="enter-title">
            For Najwa
        </div>

        <div class="enter-date">
            8 • 8
        </div>

        <button
            class="enter-button"
            onclick="enterLove()"
        >
            Tap to enter ❤️
        </button>

    </div>

</div>


<!-- MUSIC -->

<audio
    id="music"
    loop
    preload="auto"
>

    <source
        src="music.mp3"
        type="audio/mpeg"
    >

</audio>


<div id="musicHint">
    Tap anywhere ❤️ to start the music
</div>


<!-- =========================
     WEBSITE
========================= -->

<main class="main">

<div class="card">


    <div class="date">
        8 • 8
    </div>


    <div class="big-heart">
        ❤️
    </div>


    <h1>
        Najwa
    </h1>


    <div class="be-mine">
        Be Mine.
    </div>


    <!-- LOVE IMAGE -->

    <div class="love-image">

        <img
            src="love1.jpg"
            alt="Love"
        >

    </div>


    <div class="music-note">
        🎵
    </div>


    <!-- GIFT -->

    <div class="gift-area">

        <div
            class="gift"
            onclick="openGift()"
        >
            🎁
        </div>

        <div class="gift-label">
            A LITTLE SURPRISE
        </div>


        <div
            class="secret"
            id="secret"
        >

            <div class="secret-title">
                Be Mine. ❤️
            </div>

            <div class="secret-text">

                I love you forever.

            </div>

            <div class="signature">
                Naj ❤️
            </div>

        </div>

    </div>


    <div class="footer">
        8 • 8
    </div>


</div>

</main>


<script>


/* =========================
   ENTER + MUSIC
========================= */

function enterLove(){

    const enter =
        document.getElementById(
            "enter"
        );

    const music =
        document.getElementById(
            "music"
        );


    music.volume = 0.65;


    music.play()
    .catch(function(){});


    enter.style.opacity="0";


    setTimeout(function(){

        enter.style.display="none";

    },1000);

}


/* =========================
   AUTOPLAY ATTEMPT
========================= */

window.addEventListener(
    "load",
    function(){

        const music =
            document.getElementById(
                "music"
            );

        music.volume=.65;

        music.play()
        .catch(function(){

            document
                .getElementById(
                    "musicHint"
                )
                .classList
                .add("show");

        });

    }
);


/* =========================
   FALLBACK MUSIC TAP
========================= */

document.addEventListener(
    "click",
    function startMusic(){

        const music =
            document.getElementById(
                "music"
            );

        music.play()
        .then(function(){

            document
                .getElementById(
                    "musicHint"
                )
                .classList
                .remove("show");

        })
        .catch(function(){});

        document.removeEventListener(
            "click",
            startMusic
        );

    }
);


/* =========================
   GIFT
========================= */

function openGift(){

    document
        .getElementById(
            "secret"
        )
        .style.display="block";


    for(
        let i=0;
        i<35;
        i++
    ){

        setTimeout(
            createFloat,
            i*70
        );

    }


    for(
        let i=0;
        i<7;
        i++
    ){

        setTimeout(
            createLoveText,
            i*180
        );

    }

}


/* =========================
   FLOATING HEARTS + FLOWERS
========================= */

function createFloat(){

    const item =
        document.createElement(
            "div"
        );

    item.className="float";


    const emojis=[

        "❤️",
        "💗",
        "💕",
        "💖",
        "💘",
        "💞",
        "💓",
        "💝",
        "🌸"

    ];


    item.innerHTML=
        emojis[
            Math.floor(
                Math.random()
                * emojis.length
            )
        ];


    item.style.left=
        Math.random()*100+"vw";


    item.style.fontSize=
        (
            14+
            Math.random()*23
        )+"px";


    item.style.setProperty(
        "--move",
        (
            Math.random()*180-90
        )+"px"
    );


    item.style.setProperty(
        "--rotate",
        (
            Math.random()*360
        )+"deg"
    );


    item.style.animationDuration=
        (
            6+
            Math.random()*6
        )+"s";


    document.body.appendChild(item);


    setTimeout(
        function(){
            item.remove();
        },
        14000
    );

}


/* =========================
   FLOATING WORDS
========================= */

function createLoveText(){

    const text =
        document.createElement(
            "div"
        );

    text.className=
        "love-text";


    text.innerHTML=
        "I love you ❤️";


    text.style.left=
        Math.random()*80+"vw";


    text.style.setProperty(
        "--move",
        (
            Math.random()*160-80
        )+"px"
    );


    text.style.animationDuration=
        (
            8+
            Math.random()*5
        )+"s";


    document.body.appendChild(text);


    setTimeout(
        function(){
            text.remove();
        },
        14000
    );

}


/* =========================
   NORMAL FLOW
========================= */

setInterval(
    createFloat,
    700
);


setInterval(
    function(){

        if(
            Math.random()<.4
        ){

            createLoveText();

        }

    },
    2500
);

</script>

</body>
</html>

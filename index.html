<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To My Eternal Love, Najwa ❤️</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', 'Segoe UI', sans-serif;
    }

    body {
      background: #0f051d;
      color: #fff;
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }

    /* Background Star Glow Effects */
    .bg-glow {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(255, 75, 110, 0.25) 0%, rgba(15, 5, 29, 0) 70%);
      z-index: 0;
      pointer-events: none;
    }

    /* Infinite Marquee 1 - Large Heading */
    .marquee-container {
      width: 100%;
      overflow: hidden;
      white-space: nowrap;
      background: rgba(255, 255, 255, 0.03);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding: 15px 0;
      margin-top: 30px;
      z-index: 2;
    }

    .marquee-content {
      display: inline-block;
      animation: scrollLeft 25s linear infinite;
    }

    .marquee-text {
      font-size: 2rem;
      font-weight: 700;
      background: linear-gradient(45deg, #ff4b6e, #ff85a2, #ffd1dc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      padding: 0 20px;
      letter-spacing: 2px;
    }

    /* Infinite Marquee 2 - Emoji Trail */
    .emoji-marquee {
      width: 100%;
      overflow: hidden;
      white-space: nowrap;
      padding: 10px 0;
      z-index: 2;
      margin-bottom: 30px;
    }

    .emoji-content {
      display: inline-block;
      animation: scrollRight 20s linear infinite;
      font-size: 1.8rem;
    }

    /* Main Hero Card */
    .hero-card {
      position: relative;
      z-index: 2;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 30px;
      padding: 40px 30px;
      text-align: center;
      max-width: 450px;
      width: 90%;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      margin: 20px 0;
      transition: transform 0.3s ease;
    }

    .hero-card:hover {
      transform: translateY(-5px);
    }

    .avatar-heart {
      font-size: 4rem;
      animation: pulse 1.5s infinite alternate;
      display: inline-block;
      margin-bottom: 10px;
    }

    h1.name {
      font-size: 3rem;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 0 20px rgba(255, 75, 110, 0.8);
      margin-bottom: 10px;
    }

    p.subtitle {
      color: #ff85a2;
      font-size: 1.1rem;
      font-weight: 300;
      margin-bottom: 25px;
    }

    /* Interactive Tap Button */
    .special-btn {
      background: linear-gradient(135deg, #ff4b6e, #ff758c);
      color: white;
      border: none;
      padding: 15px 35px;
      border-radius: 50px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(255, 75, 110, 0.4);
      transition: all 0.3s ease;
    }

    .special-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 15px 30px rgba(255, 75, 110, 0.6);
    }

    /* Hidden Love Secret Box */
    .secret-box {
      display: none;
      margin-top: 25px;
      padding: 20px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 20px;
      border: 1px dashed rgba(255, 133, 162, 0.5);
      animation: fadeIn 1s forwards;
      line-height: 1.7;
      font-size: 1rem;
      color: #e0e0e0;
    }

    /* Falling Emojis / Particles */
    .falling-emoji {
      position: fixed;
      top: -50px;
      z-index: 1;
      pointer-events: none;
      user-select: none;
      animation: fall linear forwards;
    }

    /* Animations */
    @keyframes scrollLeft {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    @keyframes scrollRight {
      0% { transform: translateX(-50%); }
      100% { transform: translateX(0); }
    }

    @keyframes pulse {
      0% { transform: scale(1); filter: drop-shadow(0 0 5px #ff4b6e); }
      100% { transform: scale(1.15); filter: drop-shadow(0 0 20px #ff4b6e); }
    }

    @keyframes fall {
      to {
        transform: translateY(105vh) rotate(360deg);
        opacity: 0;
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="bg-glow"></div>

  <!-- Scrolling Text Line 1 -->
  <div class="marquee-container">
    <div class="marquee-content" id="textMarquee"></div>
  </div>

  <!-- Main Romantic Card -->
  <div class="hero-card">
    <div class="avatar-heart">💖</div>
    <h1 class="name">Najwa</h1>
    <p class="subtitle">You Are My Today & All Of My Tomorrows</p>

    <button class="special-btn" onclick="revealSecret()">✨ Tap For A Surprise</button>

    <div class="secret-box" id="secretMessage">
      <p>🌹 <strong>My Dearest Najwa,</strong></p>
      <p style="margin-top: 8px;">
        Out of millions of people in this world, my heart chose you. Every moment with you feels like a beautiful dream. You bring light, laughter, and infinite joy into my life!
      </p>
    </div>
  </div>

  <!-- Scrolling Emojis Line 2 -->
  <div class="emoji-marquee">
    <div class="emoji-content" id="emojiMarquee"></div>
  </div>

  <script>
    // 1. Populate Infinite Scrolling Text
    const textStream = "I LOVE YOU NAJWA ❤️ FOREVER & ALWAYS 💖 YOU ARE MY EVERYTHING 💕 ";
    const textMarquee = document.getElementById('textMarquee');
    textMarquee.innerHTML = textStream.repeat(10);

    // 2. Populate Infinite Scrolling Emojis
    const emojiStream = "💖 🌸 💍 ✨ 💕 🌹 🧸 ❤️ 👑 🥂 🦋 ";
    const emojiMarquee = document.getElementById('emojiMarquee');
    emojiMarquee.innerHTML = emojiStream.repeat(15);

    // 3. Reveal Secret Note
    function revealSecret() {
      const box = document.getElementById('secretMessage');
      box.style.display = 'block';
      
      // Burst of love particles on button click
      for(let i = 0; i < 30; i++) {
        setTimeout(createEmoji, i * 50);
      }
    }

    // 4. Continuous Emoji Rain
    const emojis = ['❤️', '💖', '✨', '🌹', '💕', '🌸', '👑', '🦋'];
    
    function createEmoji() {
      const emoji = document.createElement('div');
      emoji.classList.add('falling-emoji');
      emoji.innerText = emojis[Math.floor(Math.random() * emojis.length)];
      
      emoji.style.left = Math.random() * 100 + 'vw';
      emoji.style.animationDuration = Math.random() * 3 + 3 + 's'; // 3 to 6 sec speed
      emoji.style.fontSize = Math.random() * 20 + 15 + 'px'; // 15px to 35px
      
      document.body.appendChild(emoji);

      setTimeout(() => {
        emoji.remove();
      }, 6000);
    }

    setInterval(createEmoji, 300);

    // 5. Interactive Touch Effect (Hearts pop wherever she touches/clicks)
    document.addEventListener('click', function(e) {
      const pop = document.createElement('div');
      pop.innerText = '💖';
      pop.style.position = 'fixed';
      pop.style.left = e.clientX + 'px';
      pop.style.top = e.clientY + 'px';
      pop.style.pointerEvents = 'none';
      pop.style.fontSize = '24px';
      pop.style.transform = 'translate(-50%, -50%)';
      pop.style.animation = 'pulse 0.6s ease-out forwards';
      pop.style.zIndex = '9999';
      
      document.body.appendChild(pop);
      setTimeout(() => pop.remove(), 600);
    });
  </script>
</body>
</html>
